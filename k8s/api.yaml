---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdict-api
  namespace: verdict
spec:
  replicas: 1
  selector:
    matchLabels:
      app: verdict-api
  template:
    metadata:
      labels:
        app: verdict-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: migrate
          image: us-central1-docker.pkg.dev/verdict-ai-prod/verdict/verdict-api:latest
          command: ["sh", "-c", "cd /srv/verdict/app/backend && alembic upgrade head"]
          envFrom:
            - configMapRef:
                name: verdict-config
            - secretRef:
                name: verdict-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - name: api
          image: us-central1-docker.pkg.dev/verdict-ai-prod/verdict/verdict-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: verdict-config
            - secretRef:
                name: verdict-secrets
          volumeMounts:
            - name: documents
              mountPath: /data/documents
            - name: rag
              mountPath: /data/rag
            - name: fine-tune-output
              mountPath: /srv/verdict/scripts/fine_tune/output
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: documents
          persistentVolumeClaim:
            claimName: verdict-documents
        - name: rag
          persistentVolumeClaim:
            claimName: verdict-rag
        - name: fine-tune-output
          persistentVolumeClaim:
            claimName: verdict-fine-tune-output

---
apiVersion: v1
kind: Service
metadata:
  name: verdict-api
  namespace: verdict
  annotations:
    cloud.google.com/backend-config: '{"default":"verdict-api-backendconfig"}'
spec:
  type: NodePort
  selector:
    app: verdict-api
  ports:
    - port: 8000
      targetPort: 8000

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: verdict-api
  namespace: verdict
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: verdict-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
