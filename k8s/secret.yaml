# Secret template — replace every CHANGEME before applying.
# Recommended creation command (AKS):
#   kubectl create secret generic verdict-secrets -n verdict \
#     --from-literal=POSTGRES_DSN='postgresql://verdict:STRONGPASSWORD@verdict-postgres:5432/verdict' \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=HF_TOKEN='hf_...' \
#     --dry-run=client -o yaml | kubectl apply -f -
# Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: verdict-secrets
  namespace: verdict
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGEME"
  POSTGRES_DSN: "postgresql://verdict:CHANGEME@verdict-postgres:5432/verdict"
  SECRET_KEY: "CHANGEME-run-openssl-rand-hex-32"
  # HuggingFace token — required to pull gated google/gemma-4-26B-A4B-it model
  HF_TOKEN: "CHANGEME-hf-token"
  # Grafana admin password
  GRAFANA_ADMIN_PASSWORD: "CHANGEME-grafana-password"
