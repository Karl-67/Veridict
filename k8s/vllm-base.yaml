---
# vLLM inference server — base Gemma 4 26B (Q4 A4B quantized)
# Serves: Harvey×3 (sequential stages), AdminMergeAgent, all validators
# GPU requirement: 1× NVIDIA A100 80GB (Standard_NC24ads_A100_v4)
#
# Model download on first start: ~30–50 GB from HuggingFace.
# Readiness probe has a 5-minute initial delay to allow model loading.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdict-vllm-base
  namespace: verdict
spec:
  replicas: 1
  selector:
    matchLabels:
      app: verdict-vllm-base
  template:
    metadata:
      labels:
        app: verdict-vllm-base
    spec:
      nodeSelector:
        sku: gpu
      tolerations:
        - key: sku
          operator: Equal
          value: gpu
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - --model
            - google/gemma-4-26B-A4B-it
            - --dtype
            - auto
            - --max-model-len
            - "4096"
            - --tensor-parallel-size
            - "1"
            - --port
            - "8000"
            - --host
            - "0.0.0.0"
            - --disable-log-requests
          ports:
            - containerPort: 8000
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: verdict-secrets
                  key: HF_TOKEN
            - name: HF_HOME
              value: /root/.cache/huggingface
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 300
            periodSeconds: 15
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 360
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: verdict-vllm-base-cache

---
apiVersion: v1
kind: Service
metadata:
  name: verdict-vllm-base
  namespace: verdict
spec:
  selector:
    app: verdict-vllm-base
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
