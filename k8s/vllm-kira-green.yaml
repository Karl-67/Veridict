---
# vLLM inference server — fine-tuned Kira Gemma 4 26B  [GREEN slot]
# Starts at replicas: 0 — scaled up by blue_green_switch.py during promotion.
# Only one slot (blue or green) runs at a time to avoid double GPU cost.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdict-vllm-kira-green
  namespace: verdict
  labels:
    app: verdict-vllm-kira
    slot: green
spec:
  replicas: 0
  selector:
    matchLabels:
      app: verdict-vllm-kira
      slot: green
  template:
    metadata:
      labels:
        app: verdict-vllm-kira
        slot: green
    spec:
      nodeSelector:
        sku: gpu
      tolerations:
        - key: sku
          operator: Equal
          value: gpu
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - --model
            - google/gemma-4-26B-A4B-it
            - --dtype
            - auto
            - --max-model-len
            - "4096"
            - --tensor-parallel-size
            - "1"
            - --port
            - "8000"
            - --host
            - "0.0.0.0"
            - --disable-log-requests
            # Uncomment after LoRA adapter is uploaded to the PVC:
            # - --enable-lora
            # - --lora-modules
            # - kira=/mnt/kira-adapter
          ports:
            - containerPort: 8000
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: verdict-secrets
                  key: HF_TOKEN
            - name: HF_HOME
              value: /root/.cache/huggingface
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: kira-adapter
              mountPath: /mnt/kira-adapter
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 300
            periodSeconds: 15
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 360
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: verdict-vllm-kira-cache-green
        - name: kira-adapter
          persistentVolumeClaim:
            claimName: verdict-fine-tune-output
