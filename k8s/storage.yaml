# Persistent volumes for GKE deployment.
# Uses GCE Persistent Disk (SSD) via the pd.csi.storage.gke.io provisioner.
# For multi-replica API pods change accessModes to ReadWriteMany and use
# a Filestore-backed StorageClass (GKE Enterprise) or a shared NFS volume.
---
# GCE Persistent Disk SSD StorageClass for model weights and LoRA adapters
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: verdict-premium-ssd
provisioner: pd.csi.storage.gke.io
parameters:
  type: pd-ssd
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verdict-documents
  namespace: verdict
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verdict-rag
  namespace: verdict
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi

---
# Fine-tune adapter output — expanded to hold LoRA weights + merged checkpoint
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verdict-fine-tune-output
  namespace: verdict
spec:
  storageClassName: verdict-premium-ssd
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi

---
# HuggingFace model cache for the base Gemma 4 26B vLLM pod
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verdict-vllm-base-cache
  namespace: verdict
spec:
  storageClassName: verdict-premium-ssd
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 60Gi

---
# HuggingFace model cache for the Kira vLLM pod — BLUE slot
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verdict-vllm-kira-cache
  namespace: verdict
spec:
  storageClassName: verdict-premium-ssd
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 60Gi

---
# HuggingFace model cache for the Kira vLLM pod — GREEN slot
# Separate disk so blue and green can cache independently (avoids lock contention).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verdict-vllm-kira-cache-green
  namespace: verdict
spec:
  storageClassName: verdict-premium-ssd
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 60Gi
