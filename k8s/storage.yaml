# Persistent volumes for GKE deployment.
# Uses GCE Persistent Disk (SSD) via the pd.csi.storage.gke.io provisioner.
# For multi-replica API pods change accessModes to ReadWriteMany and use
# a Filestore-backed StorageClass (GKE Enterprise) or a shared NFS volume.
---
# GCE Persistent Disk SSD StorageClass for model weights and LoRA adapters
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: verdict-premium-ssd
provisioner: pd.csi.storage.gke.io
parameters:
  type: pd-ssd
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verdict-documents
  namespace: verdict
spec:
  storageClassName: standard-rwo
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verdict-rag
  namespace: verdict
spec:
  storageClassName: standard-rwo
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi

---
# Fine-tune adapter output — holds LoRA weights uploaded from RunPod
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verdict-fine-tune-output
  namespace: verdict
spec:
  storageClassName: standard-rwo
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
