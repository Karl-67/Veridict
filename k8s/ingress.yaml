# nginx-ingress controller ingress for GKE.
# Prerequisites (install once per cluster):
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/cloud/deploy.yaml
#
# For TLS: create a cert-manager Certificate or upload a secret and uncomment tls block.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: verdict
  namespace: verdict
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  # tls:
  #   - hosts:
  #       - verdict.yourdomain.com
  #     secretName: verdict-tls
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: verdict-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: verdict-frontend
                port:
                  number: 80
