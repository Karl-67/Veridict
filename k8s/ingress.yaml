# GKE native L7 load balancer ingress.
# Provisioning takes ~3 minutes after first apply.
# Get the IP with: kubectl get ingress verdict -n verdict
# After getting the IP, update CORS_ORIGINS in configmap.yaml and re-apply.
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: verdict-api-backendconfig
  namespace: verdict
spec:
  timeoutSec: 300

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: verdict
  namespace: verdict
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: verdict-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: verdict-frontend
                port:
                  number: 80
