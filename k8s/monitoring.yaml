# =============================================================================
# Veridict Monitoring Stack — Prometheus + Grafana
# Apply via kustomization: kubectl apply -k k8s/
# Grafana UI: kubectl port-forward svc/verdict-grafana 3000:3000 -n verdict
# =============================================================================

# -----------------------------------------------------------------------------
# RBAC — Prometheus needs to read pod metadata for kubernetes_sd_configs
# -----------------------------------------------------------------------------
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: verdict-prometheus
  namespace: verdict

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: verdict-prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: verdict-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: verdict-prometheus
subjects:
  - kind: ServiceAccount
    name: verdict-prometheus
    namespace: verdict

# -----------------------------------------------------------------------------
# Prometheus — config
# -----------------------------------------------------------------------------
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: verdict
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # Scrape pods that have prometheus.io/scrape=true annotation
      - job_name: verdict-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [verdict]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: app

      # vLLM pods expose native Prometheus metrics at /metrics
      - job_name: verdict-vllm-kira
        static_configs:
          - targets: [verdict-vllm-kira:8000]
        metrics_path: /metrics

      - job_name: verdict-vllm-base
        static_configs:
          - targets: [verdict-vllm-base:8000]
        metrics_path: /metrics

# -----------------------------------------------------------------------------
# Prometheus — storage, deployment, service
# -----------------------------------------------------------------------------
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verdict-prometheus-data
  namespace: verdict
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdict-prometheus
  namespace: verdict
spec:
  replicas: 1
  selector:
    matchLabels:
      app: verdict-prometheus
  template:
    metadata:
      labels:
        app: verdict-prometheus
    spec:
      serviceAccountName: verdict-prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.2
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: verdict-prometheus-data

---
apiVersion: v1
kind: Service
metadata:
  name: verdict-prometheus
  namespace: verdict
spec:
  selector:
    app: verdict-prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP

# -----------------------------------------------------------------------------
# Grafana — datasource + dashboard provisioning
# -----------------------------------------------------------------------------
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: verdict
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://verdict-prometheus:9090
        access: proxy
        isDefault: true
        editable: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: verdict
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: veridict
        type: file
        disableDeletion: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards

# -----------------------------------------------------------------------------
# Grafana — Veridict LLMOps dashboard JSON
# -----------------------------------------------------------------------------
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-verdict
  namespace: verdict
data:
  verdict-llmops.json: |
    {
      "title": "Veridict LLMOps",
      "uid": "veridict-llmops",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "tags": ["veridict", "llmops"],
      "panels": [

        { "id": 1, "type": "row", "title": "Pipeline Overview", "gridPos": { "x": 0, "y": 0, "w": 24, "h": 1 }, "collapsed": false },

        {
          "id": 2, "type": "stat", "title": "Runs Finalized (1h)",
          "gridPos": { "x": 0, "y": 1, "w": 4, "h": 4 },
          "options": { "colorMode": "background", "graphMode": "area" },
          "targets": [{ "expr": "increase(runs_total{status=\"finalized\"}[1h])", "legendFormat": "finalized", "datasource": "Prometheus" }],
          "fieldConfig": { "defaults": { "color": { "mode": "fixed", "fixedColor": "green" } } }
        },

        {
          "id": 3, "type": "stat", "title": "Runs Failed (1h)",
          "gridPos": { "x": 4, "y": 1, "w": 4, "h": 4 },
          "options": { "colorMode": "background", "graphMode": "area" },
          "targets": [{ "expr": "increase(runs_total{status=\"failed\"}[1h])", "legendFormat": "failed", "datasource": "Prometheus" }],
          "fieldConfig": { "defaults": { "color": { "mode": "fixed", "fixedColor": "red" } } }
        },

        {
          "id": 4, "type": "stat", "title": "JSON Repairs (1h)",
          "gridPos": { "x": 8, "y": 1, "w": 4, "h": 4 },
          "options": { "colorMode": "background", "graphMode": "area" },
          "targets": [{ "expr": "increase(json_repair_total[1h])", "legendFormat": "repairs", "datasource": "Prometheus" }],
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 5 }, { "color": "red", "value": 20 }] } } }
        },

        {
          "id": 5, "type": "stat", "title": "Kira Panel Approval Rate",
          "gridPos": { "x": 12, "y": 1, "w": 4, "h": 4 },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{
            "expr": "sum(kira_panel_votes_total{decision=\"approve\"}) / (sum(kira_panel_votes_total{decision=\"approve\"}) + sum(kira_panel_votes_total{decision=\"reject\"}))",
            "legendFormat": "approval rate", "datasource": "Prometheus"
          }],
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "red", "value": 0 }, { "color": "yellow", "value": 0.5 }, { "color": "green", "value": 0.7 }] } } }
        },

        {
          "id": 6, "type": "stat", "title": "Queue Age p95 (5m)",
          "gridPos": { "x": 16, "y": 1, "w": 4, "h": 4 },
          "options": { "colorMode": "background" },
          "targets": [{ "expr": "histogram_quantile(0.95, sum(rate(queue_age_seconds_bucket[5m])) by (le))", "legendFormat": "p95", "datasource": "Prometheus" }],
          "fieldConfig": { "defaults": { "unit": "s", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 30 }, { "color": "red", "value": 120 }] } } }
        },

        {
          "id": 7, "type": "stat", "title": "Worker Lease Expiries (1h)",
          "gridPos": { "x": 20, "y": 1, "w": 4, "h": 4 },
          "options": { "colorMode": "background" },
          "targets": [{ "expr": "increase(worker_lease_expiry_total[1h])", "legendFormat": "expiries", "datasource": "Prometheus" }],
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "red", "value": 1 }] } } }
        },

        { "id": 10, "type": "row", "title": "LLM Provider Performance", "gridPos": { "x": 0, "y": 5, "w": 24, "h": 1 }, "collapsed": false },

        {
          "id": 11, "type": "timeseries", "title": "LLM Provider Latency p95",
          "gridPos": { "x": 0, "y": 6, "w": 12, "h": 8 },
          "targets": [{
            "expr": "histogram_quantile(0.95, sum(rate(provider_latency_seconds_bucket[5m])) by (model, le))",
            "legendFormat": "{{model}}", "datasource": "Prometheus"
          }],
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "lineWidth": 2 } } },
          "options": { "tooltip": { "mode": "multi" } }
        },

        {
          "id": 12, "type": "timeseries", "title": "LLM Provider Failure Rate",
          "gridPos": { "x": 12, "y": 6, "w": 12, "h": 8 },
          "targets": [{
            "expr": "sum(rate(provider_failures_total[5m])) by (model)",
            "legendFormat": "{{model}}", "datasource": "Prometheus"
          }],
          "fieldConfig": { "defaults": { "unit": "reqps", "color": { "fixedColor": "red", "mode": "fixed" }, "custom": { "lineWidth": 2 } } }
        },

        { "id": 20, "type": "row", "title": "Kira ML Quality", "gridPos": { "x": 0, "y": 14, "w": 24, "h": 1 }, "collapsed": false },

        {
          "id": 21, "type": "piechart", "title": "Kira Panel Votes",
          "gridPos": { "x": 0, "y": 15, "w": 8, "h": 8 },
          "options": { "pieType": "donut", "legend": { "displayMode": "table", "placement": "right" } },
          "targets": [
            { "expr": "sum(kira_panel_votes_total{decision=\"approve\"})", "legendFormat": "Approve", "datasource": "Prometheus" },
            { "expr": "sum(kira_panel_votes_total{decision=\"reject\"})", "legendFormat": "Reject", "datasource": "Prometheus" }
          ]
        },

        {
          "id": 22, "type": "bargauge", "title": "Kira Iterations Distribution",
          "gridPos": { "x": 8, "y": 15, "w": 8, "h": 8 },
          "options": { "orientation": "horizontal", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            { "expr": "sum(kira_iterations_per_run_bucket{le=\"1\"})", "legendFormat": "1 iteration", "datasource": "Prometheus" },
            { "expr": "sum(kira_iterations_per_run_bucket{le=\"2\"}) - sum(kira_iterations_per_run_bucket{le=\"1\"})", "legendFormat": "2 iterations", "datasource": "Prometheus" },
            { "expr": "sum(kira_iterations_per_run_bucket{le=\"3\"}) - sum(kira_iterations_per_run_bucket{le=\"2\"})", "legendFormat": "3 iterations", "datasource": "Prometheus" }
          ]
        },

        {
          "id": 23, "type": "timeseries", "title": "Citation Validation Failures by Code",
          "gridPos": { "x": 16, "y": 15, "w": 8, "h": 8 },
          "targets": [{
            "expr": "sum(rate(citation_validation_failures_total[5m])) by (code)",
            "legendFormat": "{{code}}", "datasource": "Prometheus"
          }],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },

        { "id": 30, "type": "row", "title": "Findings", "gridPos": { "x": 0, "y": 23, "w": 24, "h": 1 }, "collapsed": false },

        {
          "id": 31, "type": "piechart", "title": "Finding Severity Distribution",
          "gridPos": { "x": 0, "y": 24, "w": 8, "h": 8 },
          "options": { "pieType": "pie", "legend": { "displayMode": "table", "placement": "right" } },
          "targets": [
            { "expr": "sum(finding_severity_total{severity=\"critical\"}) by (branch)", "legendFormat": "critical ({{branch}})", "datasource": "Prometheus" },
            { "expr": "sum(finding_severity_total{severity=\"high\"}) by (branch)", "legendFormat": "high ({{branch}})", "datasource": "Prometheus" },
            { "expr": "sum(finding_severity_total{severity=\"medium\"}) by (branch)", "legendFormat": "medium ({{branch}})", "datasource": "Prometheus" },
            { "expr": "sum(finding_severity_total{severity=\"low\"}) by (branch)", "legendFormat": "low ({{branch}})", "datasource": "Prometheus" }
          ]
        },

        {
          "id": 32, "type": "timeseries", "title": "Findings Per Run (rate)",
          "gridPos": { "x": 8, "y": 24, "w": 8, "h": 8 },
          "targets": [{
            "expr": "histogram_quantile(0.95, sum(rate(findings_per_run_bucket[30m])) by (branch, le))",
            "legendFormat": "p95 {{branch}}", "datasource": "Prometheus"
          }],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },

        {
          "id": 33, "type": "timeseries", "title": "Stage Duration p95",
          "gridPos": { "x": 16, "y": 24, "w": 8, "h": 8 },
          "targets": [{
            "expr": "histogram_quantile(0.95, sum(rate(stage_duration_seconds_bucket[5m])) by (stage, le))",
            "legendFormat": "{{stage}}", "datasource": "Prometheus"
          }],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },

        { "id": 40, "type": "row", "title": "vLLM GPU (Kira)", "gridPos": { "x": 0, "y": 32, "w": 24, "h": 1 }, "collapsed": false },

        {
          "id": 41, "type": "timeseries", "title": "GPU Cache Utilization — Kira",
          "gridPos": { "x": 0, "y": 33, "w": 6, "h": 8 },
          "targets": [{ "expr": "vllm:gpu_cache_usage_perc{job=\"verdict-vllm-kira\"}", "legendFormat": "gpu cache %", "datasource": "Prometheus" }],
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 0.7 }, { "color": "red", "value": 0.9 }] } } }
        },

        {
          "id": 42, "type": "timeseries", "title": "Token Throughput — Kira",
          "gridPos": { "x": 6, "y": 33, "w": 6, "h": 8 },
          "targets": [{ "expr": "rate(vllm:num_generation_tokens_total{job=\"verdict-vllm-kira\"}[5m])", "legendFormat": "tokens/s", "datasource": "Prometheus" }],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },

        {
          "id": 43, "type": "timeseries", "title": "Time to First Token p95 — Kira",
          "gridPos": { "x": 12, "y": 33, "w": 6, "h": 8 },
          "targets": [{ "expr": "histogram_quantile(0.95, sum(rate(vllm:time_to_first_token_seconds_bucket{job=\"verdict-vllm-kira\"}[5m])) by (le))", "legendFormat": "p95 TTFT", "datasource": "Prometheus" }],
          "fieldConfig": { "defaults": { "unit": "s", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 2 }, { "color": "red", "value": 4 }] } } }
        },

        {
          "id": 44, "type": "timeseries", "title": "Running Requests — Kira",
          "gridPos": { "x": 18, "y": 33, "w": 6, "h": 8 },
          "targets": [{ "expr": "vllm:num_requests_running{job=\"verdict-vllm-kira\"}", "legendFormat": "running", "datasource": "Prometheus" }],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },

        { "id": 50, "type": "row", "title": "Stage Retries", "gridPos": { "x": 0, "y": 41, "w": 24, "h": 1 }, "collapsed": false },

        {
          "id": 51, "type": "timeseries", "title": "Stage Retry Rate",
          "gridPos": { "x": 0, "y": 42, "w": 12, "h": 8 },
          "targets": [{ "expr": "sum(rate(retry_total[5m])) by (stage)", "legendFormat": "{{stage}}", "datasource": "Prometheus" }],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },

        {
          "id": 52, "type": "timeseries", "title": "RAG Retrieval Hits",
          "gridPos": { "x": 12, "y": 42, "w": 12, "h": 8 },
          "targets": [{ "expr": "rate(retrieval_hits_total[5m])", "legendFormat": "rag hits/s", "datasource": "Prometheus" }],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        }

      ]
    }

# -----------------------------------------------------------------------------
# Grafana — storage, deployment, service
# -----------------------------------------------------------------------------
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verdict-grafana-data
  namespace: verdict
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdict-grafana
  namespace: verdict
spec:
  replicas: 1
  selector:
    matchLabels:
      app: verdict-grafana
  template:
    metadata:
      labels:
        app: verdict-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.2
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdict-secrets
                  key: GRAFANA_ADMIN_PASSWORD
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_SERVER_ROOT_URL
              value: "%(protocol)s://%(domain)s/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-json
              mountPath: /var/lib/grafana/dashboards
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: verdict-grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard-json
          configMap:
            name: grafana-dashboard-verdict

---
apiVersion: v1
kind: Service
metadata:
  name: verdict-grafana
  namespace: verdict
spec:
  selector:
    app: verdict-grafana
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
