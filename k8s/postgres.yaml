---
apiVersion: v1
kind: Service
metadata:
  name: verdict-postgres
  namespace: verdict
spec:
  selector:
    app: verdict-postgres
  ports:
    - port: 5432
  clusterIP: None  # headless — pods connect directly

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: verdict-postgres
  namespace: verdict
spec:
  serviceName: verdict-postgres
  replicas: 1
  selector:
    matchLabels:
      app: verdict-postgres
  template:
    metadata:
      labels:
        app: verdict-postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: verdict
            - name: POSTGRES_DB
              value: verdict
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdict-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "verdict", "-d", "verdict"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "verdict", "-d", "verdict"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
