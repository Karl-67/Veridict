name: Promote Model to Production

# Trigger:
#   - Manual: Actions tab → "Promote Model to Production" → Run workflow
#   - Automatic: after eval-gate passes on main (via build-push.yml calling this via workflow_call)
#
# Secrets required:
#   MLFLOW_TRACKING_URI   — MLflow server URL
#   VLLM_ENDPOINT         — staging/prod vLLM endpoint to write into configs/models.yaml

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: "Registered model name in MLflow"
        required: true
        default: "kira"
      model_version:
        description: "Version to promote (leave blank for latest Staging)"
        required: false
        default: ""
      dry_run:
        description: "Dry run only — check thresholds, do not promote"
        type: boolean
        default: false

  workflow_call:
    inputs:
      model_name:
        type: string
        default: "kira"
      model_version:
        type: string
        default: ""
      dry_run:
        type: boolean
        default: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install mlflow pyyaml

      - name: Promote model
        run: |
          ARGS="--model ${{ inputs.model_name }}"
          if [ -n "${{ inputs.model_version }}" ]; then
            ARGS="$ARGS --version ${{ inputs.model_version }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/promote_model.py $ARGS
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          VLLM_ENDPOINT: ${{ secrets.VLLM_ENDPOINT }}

      - name: Commit configs/models.yaml update
        if: ${{ inputs.dry_run == false || inputs.dry_run == 'false' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add configs/models.yaml
          git diff --staged --quiet || git commit -m "chore: promote ${{ inputs.model_name }} v${{ inputs.model_version || 'latest' }} to Production [skip ci]"
          git push
