name: Build and Deploy to GKE

on:
  push:
    branches: [main]

env:
  GAR_REGISTRY: us-central1-docker.pkg.dev
  GAR_REPO: verdict-ai-prod/verdict
  GKE_CLUSTER: verdict-gke
  GKE_REGION: us-central1-a
  GCP_PROJECT: verdict-ai-prod

jobs:
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_REGISTRY }} --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ env.GAR_REGISTRY }}/${{ env.GAR_REPO }}/verdict-api:${{ steps.meta.outputs.tag }}
            ${{ env.GAR_REGISTRY }}/${{ env.GAR_REPO }}/verdict-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_REGISTRY }} --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: |
            ${{ env.GAR_REGISTRY }}/${{ env.GAR_REPO }}/verdict-worker:${{ steps.meta.outputs.tag }}
            ${{ env.GAR_REGISTRY }}/${{ env.GAR_REPO }}/verdict-worker:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_REGISTRY }} --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ env.GAR_REGISTRY }}/${{ env.GAR_REPO }}/verdict-frontend:${{ steps.meta.outputs.tag }}
            ${{ env.GAR_REGISTRY }}/${{ env.GAR_REPO }}/verdict-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  eval-gate:
    runs-on: ubuntu-latest
    needs: [build-api, build-worker, build-frontend]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}

      - name: Install eval dependencies
        run: pip install mlflow httpx pydantic PyYAML

      - name: Run eval gate
        run: python scripts/eval_gate.py
        env:
          IMAGE_TAG: ${{ needs.build-api.outputs.image_tag }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_EXPERIMENT: verdict-eval-gates
          EVAL_ENDPOINT: ${{ secrets.EVAL_ENDPOINT }}
          EVAL_MODEL: ${{ secrets.EVAL_MODEL }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build-api, build-worker, build-frontend]
    if: needs.build-api.result == 'success' && needs.build-worker.result == 'success' && needs.build-frontend.result == 'success'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}
          project_id: ${{ env.GCP_PROJECT }}

      - name: Pin image tags in manifests
        run: |
          TAG=${{ needs.build-api.outputs.image_tag }}
          REGISTRY=${{ env.GAR_REGISTRY }}/${{ env.GAR_REPO }}
          sed -i "s|${REGISTRY}/verdict-api:latest|${REGISTRY}/verdict-api:${TAG}|g" k8s/api.yaml  # pins both initContainer and main container
          sed -i "s|${REGISTRY}/verdict-worker:latest|${REGISTRY}/verdict-worker:${TAG}|g" k8s/worker.yaml
          sed -i "s|${REGISTRY}/verdict-frontend:latest|${REGISTRY}/verdict-frontend:${TAG}|g" k8s/frontend.yaml
      - name: Apply Kubernetes manifests
        run: kubectl apply -k k8s/

      - name: Wait for API rollout
        run: kubectl rollout status deployment/verdict-api -n verdict --timeout=10m

      - name: Wait for Worker rollout
        run: kubectl rollout status deployment/verdict-worker -n verdict --timeout=5m

      - name: Wait for Frontend rollout
        run: kubectl rollout status deployment/verdict-frontend -n verdict --timeout=5m

      - name: Smoke test — API health check
        id: smoke
        run: |
          kubectl port-forward service/verdict-api 8080:8000 -n verdict &
          PF_PID=$!
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/health || echo "000")
          kill $PF_PID 2>/dev/null || true
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "HTTP $STATUS from /api/health"
          [ "$STATUS" = "200" ]

      - name: Auto-rollback on failure
        if: failure() && steps.smoke.conclusion == 'failure'
        run: |
          echo "Smoke test failed — rolling back"
          python scripts/rollback.py --scope api worker frontend
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
