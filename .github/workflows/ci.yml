name: CI

on:
  push:
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: verdict
          POSTGRES_PASSWORD: verdict
          POSTGRES_DB: verdict
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U verdict -d verdict"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r app/backend/requirements.txt
      - run: pytest -q
        env:
          POSTGRES_DSN: postgresql://verdict:verdict@localhost:5432/verdict

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: app/frontend/package-lock.json}
      - run: npm ci
        working-directory: app/frontend
      - run: npm run build
        working-directory: app/frontend

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.api .
      - run: docker build -f Dockerfile.worker .
      - run: docker build -f Dockerfile.frontend .
