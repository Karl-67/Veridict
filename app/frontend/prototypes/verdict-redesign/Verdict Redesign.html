<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veridict — Contract Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #F8F6F1;
      --surface:      #FFFFFF;
      --hover-bg:     #F2EFE9;
      --accent:       #C8973E;
      --accent-hover: #B5862F;
      --text:         #1C1917;
      --text-2:       #78716C;
      --text-3:       #A8A29E;
      --border:       #E7E3DC;
      --border-light: #F0EDE8;
      --risk-high:    #C4432B;
      --risk-medium:  #C8973E;
      --risk-low:     #3D8B5E;
      --font-serif:   'Playfair Display', Georgia, serif;
      --font-sans:    'DM Sans', system-ui, sans-serif;
      --h-font:       var(--font-serif);
      --density-pad:  60px;
      --density-gap:  48px;
    }

    .dark {
      --bg:           #18161399;
      --bg:           #1A1815;
      --surface:      #242220;
      --hover-bg:     #2A2825;
      --accent:       #C8973E;
      --accent-hover: #D9A84F;
      --text:         #F5F3EE;
      --text-2:       #9A9490;
      --text-3:       #6B6560;
      --border:       #38342F;
      --border-light: #2E2B27;
      --risk-high:    #E05A43;
      --risk-medium:  #D9A84F;
      --risk-low:     #4EA872;
    }

    html { font-size: 15px; scroll-behavior: smooth; }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background 0.3s, color 0.3s;
    }

    /* Animations */
    @keyframes fadeIn    { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse     { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @keyframes slideWidth { from { width: 0; } }

    .fade-in { animation: fadeIn 0.4s ease both; }
    .pulse   { animation: pulse 1.8s ease-in-out infinite; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Reset */
    button { cursor: pointer; border: none; background: none; font: inherit; color: inherit; }
    input, textarea, select { font: inherit; color: inherit; }
    a { color: inherit; text-decoration: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="components/AppCore.jsx"></script>
  <script type="text/babel" src="components/Screens.jsx"></script>
  <script type="text/babel" src="components/VerdictView.jsx"></script>
  <script type="text/babel" src="components/MoreScreens.jsx"></script>
  <script type="text/babel" src="components/AdminScreen.jsx"></script>
  <script type="text/babel" src="components/AuthScreen.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement(App)
    );
  </script>
</body>
</html>
