server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Forward /api/ requests to the API service.
    #
    # In normal operation the GCE L7 ingress routes /api → verdict-api:8000
    # before the request ever reaches this pod. This block is a fallback for
    # the window during API pod restarts when GCE marks the API backend
    # unhealthy and falls back to this (the default /) backend. Without it,
    # nginx returns 405 on POST requests because try_files doesn't allow POST.
    #
    # If the API pod is genuinely down nginx returns 502 — a clear error
    # instead of a misleading 405.
    location /api/ {
        proxy_pass         http://verdict-api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    310s;
        proxy_send_timeout    310s;
        proxy_connect_timeout  10s;
        client_max_body_size  100m;
    }

    # React Router — serve index.html for all non-asset paths so client-side
    # routing works on hard refresh (e.g. /contracts/123 doesn't 404).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compress text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache immutable hashed assets aggressively; HTML never cached
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
