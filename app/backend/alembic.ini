[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
version_path_separator = os

# Database URL is resolved by env.py from POSTGRES_DSN in .env.
# env.py automatically translates +asyncpg → +psycopg2 because alembic
# runs migrations with a sync engine.
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
